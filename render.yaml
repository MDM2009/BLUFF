services:
  - type: web
    name: bluff-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: CLIENT_ORIGIN
        sync: false   # URL фронтенда, например https://bluff-client.onrender.com
  - type: web
    name: bluff-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        sync: false   # URL сервера, например https://bluff-server.onrender.com
